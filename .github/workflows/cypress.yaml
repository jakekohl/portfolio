name: Cypress Tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          working-directory: ./frontend
          start: npm run cy:ci
          wait-on: 'http://localhost:5173'
          record: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
